{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
  .zoom-connection-test-result { margin: 0.75rem 0 1rem; }
  .zoom-connection-test-result ul { margin: 0.25rem 0 0; padding-left: 1.25rem; }
</style>
{% endblock %}

{% block after_field_sets %}
{{ block.super }}
{% if user.is_superuser %}
<div class="submit-row" style="text-align:left; background:transparent; border:0; padding:0 0 1rem;">
  <button type="button" class="default" id="zoom-connection-test-btn">
    Zoom 연결 테스트
  </button>
  <div class="zoom-connection-test-result" id="zoom-connection-test-result" aria-live="polite"></div>
</div>
<script>
(function () {
  const btn = document.getElementById("zoom-connection-test-btn");
  const out = document.getElementById("zoom-connection-test-result");
  const field = document.getElementById("id_licensed_user_emails");
  if (!btn || !field) return;
  const url = "{% url 'admin:scheduling_remotezoomschedulingsettings_zoom_test' %}";
  const csrf = document.querySelector("[name=csrfmiddlewaretoken]");
  btn.addEventListener("click", async function () {
    out.textContent = "테스트 중…";
    const body = new URLSearchParams();
    body.set("licensed_user_emails", field.value);
    if (csrf) body.set("csrfmiddlewaretoken", csrf.value);
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "X-CSRFToken": csrf ? csrf.value : "",
          "X-Requested-With": "XMLHttpRequest",
        },
        body,
      });
      const data = await res.json();
      const items = (data.messages || []).map(function (m) { return "<li>" + m + "</li>"; }).join("");
      out.innerHTML = (data.ok ? "<strong>성공</strong>" : "<strong>실패</strong>") + "<ul>" + items + "</ul>";
    } catch (err) {
      out.textContent = "연결 테스트를 실행하지 못했습니다.";
    }
  });
})();
</script>
{% endif %}
{% endblock %}
