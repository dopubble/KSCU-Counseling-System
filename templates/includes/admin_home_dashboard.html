<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
    <div>
        <p class="admin-home-dashboard-eyebrow mb-1">관리자</p>
        <h2 class="h4 fw-bold text-kscu mb-0">센터 현황</h2>
    </div>
    <a href="{% url 'admin_panel:dashboard' %}" class="btn btn-sm btn-outline-primary">
        관리자 대시보드 전체 보기 <i class="bi bi-arrow-right ms-1"></i>
    </a>
</div>

{% if admin_home.cancel_pending_count %}
<div class="alert alert-warning border-0 shadow-sm mb-4 d-flex flex-wrap align-items-center gap-2" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i>
    <span>
        <strong>상담 취소 요청 대기 {{ admin_home.cancel_pending_count }}건</strong> —
        내담자가 확정 예약에 대해 취소를 요청했습니다.
    </span>
    <a href="{% url 'admin_panel:cancel_pending_list' %}" class="btn btn-sm btn-warning ms-auto">목록 보기</a>
</div>
{% endif %}
