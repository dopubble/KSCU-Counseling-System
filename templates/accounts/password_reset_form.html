{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}비밀번호 찾기 — KSCU 전문상담센터{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-2">비밀번호 찾기</h2>
                <p class="text-muted text-center small mb-4">
                    가입 시 등록한 이메일로 비밀번호 재설정 링크를 보내 드립니다.
                </p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">재설정 링크 받기</button>
                </form>
                <p class="text-center mt-3 mb-0 small">
                    <a href="{% url 'accounts:login' %}">로그인</a>
                    ·
                    <a href="{% url 'accounts:find_id' %}">아이디 찾기</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
