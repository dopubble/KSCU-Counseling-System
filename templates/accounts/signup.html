{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}회원가입 - KSCU 전문상담센터{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">회원가입</h2>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% if next_url %}
                    <input type="hidden" name="next" value="{{ next_url }}">
                    {% endif %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">가입하기</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    이미 계정이 있으신가요?
                    <a href="{% url 'accounts:login' %}{% if next_url %}?next={{ next_url|urlencode }}{% endif %}">로그인</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
