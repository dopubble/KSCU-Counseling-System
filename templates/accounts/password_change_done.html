{% extends "base.html" %}

{% block title %}비밀번호 변경 완료{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5 text-center">
                <i class="bi bi-check-circle-fill text-success fs-1 mb-3" aria-hidden="true"></i>
                <h2 class="h4 fw-semibold mb-3">비밀번호가 변경되었습니다</h2>
                <p class="text-muted mb-4">다음 로그인부터 새 비밀번호를 사용합니다.</p>
                <a href="{{ dashboard_url }}" class="btn btn-primary w-100">
                    {{ dashboard_label }}로 이동
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
