{% extends "base.html" %}

{% block title %}비밀번호 재설정 메일 발송 — 숭실사이버대학교 평생교육원{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h2 class="h4 fw-semibold mb-3">이메일을 확인해 주세요</h2>
                <p class="text-muted mb-4">
                    입력하신 이메일 주소가 시스템에 등록되어 있다면,
                    비밀번호 재설정 안내 메일을 보냈습니다.<br>
                    메일이 보이지 않으면 스팸함을 확인해 주세요.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary">로그인으로 돌아가기</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
