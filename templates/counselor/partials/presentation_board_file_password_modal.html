<div class="modal fade" id="presentationBoardFileDownloadModal" tabindex="-1" aria-labelledby="presentationBoardFileDownloadModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="post"
                  id="presentationBoardFileDownloadForm"
                  action="">
                {% csrf_token %}
                <input type="hidden" name="next" id="presentationBoardFileDownloadNext" value="">
                <div class="modal-header">
                    <h5 class="modal-title" id="presentationBoardFileDownloadModalLabel">암호 PDF 다운로드</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">{{ file_password_notice }}</p>
                    <p class="small mb-3">
                        <span class="text-muted">파일:</span>
                        <span class="fw-semibold" id="presentationBoardFileDownloadName"></span>
                    </p>
                    <label for="presentationBoardFilePassword" class="form-label fw-semibold">이 PDF에 설정할 암호</label>
                    <input type="password"
                           class="form-control"
                           id="presentationBoardFilePassword"
                           name="file_password"
                           required
                           minlength="4"
                           autocomplete="new-password"
                           placeholder="4자 이상 입력 (다운로드 파일 열 때 사용)">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-counselor text-white">다운로드</button>
                </div>
            </form>
        </div>
    </div>
</div>
