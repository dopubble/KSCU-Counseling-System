{% if requires_password %}
<button type="button"
        class="{{ button_class }}"
        data-bs-toggle="modal"
        data-bs-target="#presentationBoardFileDownloadModal"
        data-file-fetch-url="{{ download_url }}"
        data-file-label="{{ filename }}">
    {% if show_icon %}<i class="bi bi-download me-1"></i>{% endif %}{{ button_label|default:filename }}
</button>
{% else %}
<a href="{{ download_url }}"
   class="{{ button_class }}">
    {% if show_icon %}<i class="bi bi-download me-1"></i>{% endif %}{{ button_label|default:filename }}
</a>
{% endif %}
