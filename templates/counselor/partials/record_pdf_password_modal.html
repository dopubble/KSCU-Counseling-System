{% if can_download_pdf %}
<div class="modal fade" id="recordPdfDownloadModal" tabindex="-1" aria-labelledby="recordPdfDownloadModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" id="recordPdfDownloadForm" action="">
                {% csrf_token %}
                <input type="hidden" name="next" id="recordPdfDownloadNext" value="">
                <div class="modal-header">
                    <h5 class="modal-title" id="recordPdfDownloadModalLabel">PDF 다운로드</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">다운로드할 PDF를 열 때 사용할 암호를 입력하세요. (4자 이상)</p>
                    <label for="recordPdfPassword" class="form-label fw-semibold">PDF 암호</label>
                    <input type="password" class="form-control" id="recordPdfPassword" name="pdf_password" required minlength="4" autocomplete="new-password">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-danger">다운로드</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
(function () {
    var modal = document.getElementById('recordPdfDownloadModal');
    if (!modal) return;
    modal.addEventListener('show.bs.modal', function (e) {
        var btn = e.relatedTarget;
        var form = document.getElementById('recordPdfDownloadForm');
        var nextInput = document.getElementById('recordPdfDownloadNext');
        form.action = btn.getAttribute('data-pdf-action');
        nextInput.value = window.location.pathname + window.location.search;
        document.getElementById('recordPdfPassword').value = '';
    });
})();
</script>
{% endif %}
