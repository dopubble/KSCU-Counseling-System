services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kscu_counseling
      POSTGRES_USER: kscu
      POSTGRES_PASSWORD: kscu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ..:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: kscu_counseling.settings.development
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
      DATABASE_URL: postgres://kscu:kscu@db:5432/kscu_counseling
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A kscu_counseling worker -l info
    volumes:
      - ..:/app
    environment:
      DJANGO_SETTINGS_MODULE: kscu_counseling.settings.development
      SECRET_KEY: dev-secret-key
      DATABASE_URL: postgres://kscu:kscu@db:5432/kscu_counseling
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_data:
