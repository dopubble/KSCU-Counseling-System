# Railway 배포 설정 — Web 서비스용
# https://docs.railway.com/guides/config-as-code

[build]
builder = "nixpacks"
# Nixpacks가 requirements.txt 설치 후 collectstatic만 추가 실행
buildCommand = "python manage.py collectstatic --noinput"

[deploy]
preDeployCommand = "python manage.py migrate --noinput"
startCommand = "gunicorn kscu_counseling.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
